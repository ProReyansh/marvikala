[build]
  publish = "client/dist"
  command = "npm run build"

[[redirects]]
  from   = "/api/*"
  to     = "https://marvikala-api.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/uploads/*"
  to     = "https://marvikala-api.onrender.com/uploads/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
