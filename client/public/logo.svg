<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Yellow circle background -->
  <circle cx="50" cy="50" r="49" fill="#F5A623"/>

  <!-- Thumb (left side, angled outward) -->
  <rect x="13" y="47" width="12" height="25" rx="6" fill="white" transform="rotate(-18 19 59)"/>

  <!-- Palm (wide and flat) -->
  <rect x="22" y="54" width="55" height="30" rx="9" fill="white"/>

  <!-- Index finger -->
  <rect x="25" y="25" width="11" height="37" rx="5.5" fill="white"/>

  <!-- Middle finger (tallest) -->
  <rect x="38" y="18" width="11" height="44" rx="5.5" fill="white"/>

  <!-- Ring finger -->
  <rect x="51" y="22" width="11" height="40" rx="5.5" fill="white"/>

  <!-- Pinky -->
  <rect x="63" y="29" width="10" height="33" rx="5" fill="white"/>

  <!-- M letter as a solid path (not text — ensures exact shape) -->
  <!-- Bold M centered in palm: left x=33, right x=65, top y=60, bottom y=82 -->
  <path fill="#F5A623" d="
    M 33,82
    L 33,60
    L 42,60
    L 49,70
    L 56,60
    L 65,60
    L 65,82
    L 57,82
    L 57,72
    L 49,78
    L 41,72
    L 41,82
    Z
  "/>

</svg>
